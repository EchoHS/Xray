name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          is_sh_ver=$(sed -n 's/^is_sh_ver=//p' xray.sh)
          test -n "$is_sh_ver"
          echo "is_sh_ver=$is_sh_ver" >> "$GITHUB_ENV"
      - name: zip
        run: zip -9vr code.zip . -x .\*
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: code.zip
          tag_name: ${{ env.is_sh_ver }}
